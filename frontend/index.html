<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No favicon for now — the empty data URI stops browsers from
         auto-requesting /favicon.ico (which doesn't exist) once this <link>
         is removed entirely. Swap the href for a real icon file when one
         exists, e.g. <link rel="icon" href="/favicon.svg" />. -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Cool</title>
    <!-- Default/fallback description — usePageMeta.ts overwrites this per
         route once the app mounts; kept here too so it's non-empty for
         anything that reads it before JS runs (crawlers, link previews). -->
    <meta
      name="description"
      content="Urban Cool — AC, refrigerator, washing machine, and microwave repair and service booking in Kochi, Kerala."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
