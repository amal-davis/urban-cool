name: Deploy Urban Cool

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # The frontend now lives in its own subdirectory (a frontend/+backend/
    # split, alongside the new Django backend) rather than at the repo
    # root — every `run:` step below executes inside it as a result. `uses:`
    # steps (checkout, setup-node, configure-pages, deploy-pages) aren't
    # affected by this and don't need a path.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend/dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
